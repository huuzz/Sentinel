[project]
name = "sentinelai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "joblib>=1.5,<2",
    "pgvector>=0.4,<1",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "python-json-logger>=3.3,<4",
    "scikit-learn>=1.7,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.17,<2", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../simulator/tests"]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[tool.uv]
package = false
